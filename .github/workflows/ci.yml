name: CI - Testes e Qualidade (Python)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov flake8
        # Adicione aqui as outras dependências do seu requirements.txt quando tiver

    - name: Analisar código com Flake8 (Clean Code)
      run: |
        # Ignora linhas muito longas e erros comuns de formatação para não travar no início
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true

    - name: Rodar Testes Unitários (TDD)
      run: |
        pytest --cov=. --cov-report=xml || true 
        # O "|| true" é para o CI não quebrar agora que ainda não temos testes escritos. 
        # Quando tiverem os testes, removam o "|| true" para forçar a aprovação!

    - name: Upload do relatório de cobertura
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: coverage.xml
