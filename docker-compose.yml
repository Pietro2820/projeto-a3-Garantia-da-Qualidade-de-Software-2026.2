services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  celery-worker:
    build: .
    command: celery -A app.queue.celery_app worker --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      - redis