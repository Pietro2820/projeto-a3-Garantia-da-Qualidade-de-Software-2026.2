services:
  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  celery-worker:
    build: .
    restart: unless-stopped
    command: celery -A app.queue.celery_app worker --loglevel=info
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    # Volumes COMPARTILHADOS com a api (ver bloco `volumes:` no fim).
    volumes:
      - uploads:/app/uploads
      - videos:/app/videos
      - dados:/app/data
    depends_on:
      - redis

  api:
    build: .
    restart: unless-stopped
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    volumes:
      - uploads:/app/uploads
      - videos:/app/videos
      - dados:/app/data
    depends_on:
      - redis
      - celery-worker

# Sem estes volumes, api e celery-worker são containers ISOLADOS: o upload
# salva o original em /app/uploads DENTRO do container da api e o worker não
# encontra o arquivo no mesmo caminho do container dele — a transcodificação
# falha ("arquivo ausente") ou a tarefa nunca é processada, e o modal de
# upload fica travado. O mesmo vale para /app/videos (a api precisa enxergar
# o HLS que o worker gerou para servir em /videos e listar no catálogo) e
# /app/data (banco JSON local de fallback, sem Supabase).
volumes:
  uploads:
  videos:
  dados: