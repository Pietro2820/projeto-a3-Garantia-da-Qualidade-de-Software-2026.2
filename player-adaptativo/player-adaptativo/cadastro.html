<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Criar conta no EduStream — plataforma de streaming de vídeo educacional">
  <title>EduStream — Criar conta</title>
  <link rel="stylesheet" href="./css/player.css">
  <link rel="stylesheet" href="./css/login.css">
</head>
<body class="login-body">

  <main class="login-wrap">

    <!-- Marca no topo — também é a rota de fuga para quem só quer voltar ao catálogo. -->
    <a class="brand login-brand" href="./home.html" aria-label="EduStream — voltar para o início">Edu<span>Stream</span></a>

    <section class="login-card" aria-labelledby="cadastroTitulo">

      <header class="login-header">
        <h1 id="cadastroTitulo">Criar conta</h1>
        <p>Crie sua conta para começar a assistir</p>
      </header>

      <form id="cadastroForm" novalidate>

        <!-- Nome -->
        <div class="field">
          <label for="nomeCadastro">Nome</label>
          <div class="input-wrap">
            <svg class="input-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input type="text" id="nomeCadastro" name="nome" placeholder="Seu nome"
                   autocomplete="name" spellcheck="false"
                   aria-describedby="nomeCadastroErro" required>
          </div>
          <p class="field-erro" id="nomeCadastroErro" hidden></p>
        </div>

        <!-- E-mail -->
        <div class="field">
          <label for="emailCadastro">E-mail</label>
          <div class="input-wrap">
            <svg class="input-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
              <polyline points="22,6 12,13 2,6"/>
            </svg>
            <input type="email" id="emailCadastro" name="email" placeholder="voce@exemplo.com"
                   autocomplete="email" inputmode="email" spellcheck="false"
                   aria-describedby="emailCadastroErro" required>
          </div>
          <p class="field-erro" id="emailCadastroErro" hidden></p>
        </div>

        <!-- Senha + mostrar/esconder -->
        <div class="field">
          <label for="senhaCadastro">Senha</label>
          <div class="input-wrap">
            <svg class="input-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
            <input type="password" id="senhaCadastro" name="senha" placeholder="Mínimo de 8 caracteres"
                   autocomplete="new-password" minlength="8"
                   aria-describedby="senhaCadastroErro capsCadastroAviso" required>
            <button type="button" class="toggle-senha" id="toggleSenhaCadastro"
                    aria-label="Mostrar senha" aria-pressed="false" title="Mostrar senha">
              <svg class="olho-aberto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="olho-fechado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <p class="caps-aviso" id="capsCadastroAviso" hidden>Caps Lock ativado</p>
          <p class="field-erro" id="senhaCadastroErro" hidden></p>
        </div>

        <!-- Confirmar senha + mostrar/esconder -->
        <div class="field">
          <label for="confirmarCadastro">Confirmar senha</label>
          <div class="input-wrap">
            <svg class="input-icone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
              <polyline points="9 12 11 14 15 10"/>
            </svg>
            <input type="password" id="confirmarCadastro" name="confirmarSenha" placeholder="Repita a senha"
                   autocomplete="new-password"
                   aria-describedby="confirmarCadastroErro capsConfirmarAviso" required>
            <button type="button" class="toggle-senha" id="toggleSenhaConfirmar"
                    aria-label="Mostrar senha" aria-pressed="false" title="Mostrar senha">
              <svg class="olho-aberto" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg class="olho-fechado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <p class="caps-aviso" id="capsConfirmarAviso" hidden>Caps Lock ativado</p>
          <p class="field-erro" id="confirmarCadastroErro" hidden></p>
        </div>

        <button type="submit" class="btn-primary btn-entrar" id="btnCadastrar">
          <span class="rotulo">Criar conta</span>
          <span class="spinner-mini" aria-hidden="true"></span>
        </button>
      </form>

      <!-- Avisos não-bloqueantes (ex.: banco indisponível / API desligada). -->
      <p class="login-aviso" id="cadastroAviso" role="status" hidden></p>

      <p class="login-cadastro">
        <span>Já tem uma conta?</span>
        <a class="link" id="linkLogin" href="./login.html">Entrar</a>
      </p>
    </section>

    <p class="login-rodape">Projeto A3 · Garantia &amp; Qualidade de Software</p>
  </main>

  <script type="module" src="./js/cadastro.js"></script>
</body>
</html>
